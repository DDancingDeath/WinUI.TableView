<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Hard Drive Body -->
  <rect x="2" y="8" width="20" height="11" rx="1" fill="#3A3A3A" stroke="#2A2A2A" stroke-width="0.5"/>
  
  <!-- Drive Top Panel -->
  <rect x="2" y="8" width="20" height="3" rx="1" fill="#5A5A5A"/>
  
  <!-- Drive Label Area -->
  <rect x="2" y="11" width="20" height="5" fill="#4A4A4A"/>
  
  <!-- LED Indicator Light -->
  <circle cx="5" cy="13.5" r="0.8" fill="#4CAF50"/>
  
  <!-- Drive Activity Light -->
  <circle cx="7.5" cy="13.5" r="0.6" fill="#FFB300"/>
  
  <!-- Horizontal Lines (Drive Texture) -->
  <line x1="2" y1="11" x2="22" y2="11" stroke="#2A2A2A" stroke-width="0.3"/>
  <line x1="2" y1="16" x2="22" y2="16" stroke="#2A2A2A" stroke-width="0.3"/>
  
  <!-- Screws -->
  <circle cx="4" cy="17.5" r="0.5" fill="#2A2A2A"/>
  <circle cx="20" cy="17.5" r="0.5" fill="#2A2A2A"/>
  
  <!-- Drive Label Text Area (optional) -->
  <rect x="10" y="12.5" width="9" height="2" rx="0.3" fill="#383838"/>
</svg>
